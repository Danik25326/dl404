<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="#050508"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="92" fill="none" stroke="url(#grad)" stroke-opacity="0.35" stroke-width="6"/>

  <!-- DL -->
  <text x="256" y="245" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="150" letter-spacing="4" text-anchor="middle" fill="url(#grad)">DL</text>

  <!-- 404 -->
  <text x="256" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="120" letter-spacing="2" text-anchor="middle" fill="url(#grad)">404</text>
</svg>
